name: 3DGUT tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/**']

permissions:
  contents: read

jobs:
  cpu:
    name: 3DGUT CPU and Python regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: legacy
      TINYSPLAT_BUILD_EXTENSIONS: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install numpy==2.4.6 opencv-python-headless==5.0.0.93 pytest==9.1.1 tqdm==4.66.5 viser==1.1.1
      - name: Run Python tests
        run: python -P -m pytest -q -ra tests
